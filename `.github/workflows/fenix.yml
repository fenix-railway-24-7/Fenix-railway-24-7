name: FENIX 24-7 AUTO
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install express
      - run: node server.js
