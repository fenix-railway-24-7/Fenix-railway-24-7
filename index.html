async function cargarTodasNoticiasMercado(){try{let fuentes=['https://www.coindesk.com/arc/outboundfeeds/rss/','https://www.federalreserve.gov/feeds/press_all.xml'],todasNoticias=[];for(let url of fuentes){try{let r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url)),data=await r.json();if(data.items)todasNoticias=todasNoticias.concat(data.items.slice(0,4));}catch{}}let mundialQs=['Trump tariffs','Elon Musk','Bitcoin ETF','war market'];for(let q of mundialQs){try{let url='https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=en-US&gl=US&ceid=US:en',r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url)),data=await r.json();if(data.items)todasNoticias=todasNoticias.concat(data.items.slice(0,2));}catch{}}let usaNews=todasNoticias.filter(n=>/FED|TRUMP|ELON|MUSK|BINANCE|BTC|WAR/i.test(n.title)).slice(0,10),htmlUSA=usaNews.map(n=>{let tag=n.title.toLowerCase().includes('trump')?'TRUMP':n.title.toLowerCase().includes('elon')||n.title.toLowerCase().includes('musk')?'ELON':n.title.toLowerCase().includes('binance')?'BINANCE':'USA';return "<div style='padding:6px;background:#001a33;border-left:3px solid #0066cc;margin-bottom:4px;border-radius:4px'><span style='color:#66ccff;font-weight:900;font-size:10px'>"+tag+"</span><br><span style='color:#fff;font-size:11px'>"+n.title+"</span><br><span style='color:#888;font-size:9px'>"+new Date(n.pubDate||Date.now()).toLocaleTimeString()+"</span></div>";}).join('')||'<div style="color:#888">Vigilando FED, TRUMP, ELON, BINANCE...</div>';document.getElementById('noticiasUSALista').innerHTML=htmlUSA;if(usaNews[0])document.getElementById('usaNewsBar').innerHTML="MUNDIAL: "+usaNews[0].title.slice(0,90)+"...";document.getElementById('newsBar').innerHTML="MUNDIAL: FED + TRUMP + ELON + BINANCE | "+new Date().toLocaleTimeString();}catch{}}
async function renderPumpsEnVivo(){let html='<b style="color:#00ff88;font-size:11px">PUMPS 24/7 - X20 TP CONFIRMADO - BOTONES BINANCE</b>',ahora=Date.now();Object.keys(pumpsEstado).forEach(k=>{if(ahora-pumpsEstado[k].time>300000)delete pumpsEstado[k];});let activosPumps=Object.keys(pumpsEstado).filter(k=>ahora-pumpsEstado[k].time<300000);if(activosPumps.length===0)html+="<div style='padding:10px;text-align:center;color:#555;font-size:11px;margin-top:6px;border:1px dashed #333;border-radius:6px'>Todos en vigilancia - BULLA 0.123360</div>";else activosPumps.forEach(sym=>{let restante=Math.ceil((300000-(ahora-pumpsEstado[sym].time))/1000);html+="<div style='background:#111;padding:6px;margin-top:6px;border-radius:10px;border:1px solid #444'><div style='font-size:11px'>"+sym+" <span style='float:right;font-size:9px;color:#888'>"+restante+"s</span></div><div style='margin-top:4px'>"+pumpsEstado[sym].html+"</div></div>";});document.getElementById('noticiasLista').innerHTML=html;}
function revisarTrades(precioActual,sym){historial.forEach(h=>{if(h.symbol===sym&&h.resultado==='PENDING'){let isLong=h.tipo.includes('LONG'),lev=h.conf100?20:10,hora=new Date().toLocaleString();if(isLong&&precioActual>=h.tp1){h.resultado='WIN';h.exitPrice=h.tp1;h.horaGanada=hora;h.profit=calcGanancia(h.entry,h.tp1,'LONG',10,lev);h.profit20=calcGanancia(h.entry,h.tp1,'LONG',10,20);beep(1200);}if(!isLong&&precioActual<=h.tp1){h.resultado='WIN';h.exitPrice=h.tp1;h.horaGanada=hora;h.profit=calcGanancia(h.entry,h.tp1,'SHORT',10,lev);h.profit20=calcGanancia(h.entry,h.tp1,'SHORT',10,20);beep(1200);}if(isLong&&precioActual<=h.sl){h.resultado='LOSS';h.exitPrice=h.sl;h.horaGanada=hora;h.profit=calcGanancia(h.entry,h.sl,'LONG',10,lev);h.profit20=calcGanancia(h.entry,h.sl,'LONG',10,20);beep(300);}if(!isLong&&precioActual>=h.sl){h.resultado='LOSS';h.exitPrice=h.sl;h.horaGanada=hora;h.profit=calcGanancia(h.entry,h.sl,'SHORT',10,lev);h.profit20=calcGanancia(h.entry,h.sl,'SHORT',10,20);beep(300);}}});guardarHistorial();}
async function fetchTF(sym,interval){try{let r=await fetch('https://fapi.binance.com/fapi/v1/klines?symbol='+sym+'&interval='+interval+'&limit=60'),k=await r.json();if(!k||k.length<30)return null;let closes=k.map(x=>parseFloat(x[4]));return{closes,ema9:ema(closes,9),ema21:ema(closes,21),rsi:rsi(closes),boll:boll(closes),atr:atr(k),precio:closes[closes.length-1],macd:macd(closes),vwap:vwap(k),vol:volumenConfirm(k),klines:k};}catch{return null;}}
async function check(sym){try{let main=await fetchTF(sym,'1m');if(!main)return;let precio=main.precio,dec=precio<1?6:2;if(precio>=1000)dec=2;document.getElementById('p-'+sym).innerHTML="PRECIO: $"+precio.toFixed(dec)+" <span style='font-size:10px;color:#00ff88'>⚡ RAPIDO</span>";document.getElementById('tf-'+sym).innerHTML="⚡ RAPIDO...";revisarTrades(precio,sym);let bullish=0,bearish=0,tfText='1m:🟢 ';if(!estado[sym])estado[sym]={lastP:0,bloq:false,showUntil:0,lastPivotCheck:0,monthlyPivot:null,yearlyPivot:null,lastSignal:0,telegramEnviado:false};let st=estado[sym],b=main.boll,vol=main.vol,ahora=Date.now();if(ahora-st.lastPivotCheck>300000||!st.monthlyPivot){getMonthlyYearlyPivot(sym).then(p=>{st.monthlyPivot=p.monthlyPivot;st.yearlyPivot=p.yearlyPivot;st.lastPivotCheck=ahora;});}if(ahora-st.lastSignal<600000){st.lastP=precio;return;}if(st.showUntil>0&&ahora>st.showUntil){document.getElementById('sig-'+sym).innerHTML="<div style='padding:8px;text-align:center;color:#555;font-size:10px;border:1px dashed #333;border-radius:6px'>Vigilando "+sym+" - BULLA 0.12</div>";st.showUntil=0;st.bloq=false;st.telegramEnviado=false;}if(st.showUntil>0&&ahora<st.showUntil){st.lastP=precio;return;}for(let tf of['5m','15m','1h','2h','4h','1d']){let d=await fetchTF(sym,tf);if(!d)continue;if(d.ema9>d.ema21&&d.rsi>55&&d.macd.macd>d.macd.signal&&d.precio>d.vwap)bullish++;if(d.ema9<d.ema21&&d.rsi<45&&d.macd.macd<d.macd.signal&&d.precio<d.vwap)bearish++;tfText+=tf+":"+(d.ema9>d.ema21?'🟢':'🔴')+" ";document.getElementById('tf-'+sym).innerHTML=tfText+" | "+bullish+"/7 LONG | "+bearish+"/7 SHORT";}let nearMonthlyPivot=st.monthlyPivot&&Math.abs(precio-st.monthlyPivot)/precio<0.012,heavyResistance=main.klines&&Math.max(...main.klines.slice(-20).map(x=>parseFloat(x[2])))*0.985<precio,supportZone=main.klines&&Math.min(...main.klines.slice(-20).map(x=>parseFloat(x[3])))*1.015>precio,granReboteVol=main.vol.ratio>2.2,nearYearlyPivot=st.yearlyPivot&&Math.abs(precio-st.yearlyPivot)/precio<0.02;if(nearMonthlyPivot&&heavyResistance&&main.rsi>66&&precio>main.boll.up*0.995&&vol.ok&&granReboteVol&&bearish>=6&&st.lastP>0){let sl=precio+main.atr*1.0,tp1=precio*0.90,tp2=precio*0.85,caja=caja100Short(sym,precio,sl,tp1,tp2,main.vol.ratio,main.rsi);document.getElementById('sig-'+sym).innerHTML=caja;pumpsEstado[sym]={time:ahora,html:caja};mostrarAlerta('SHORT LIQUIDACION -10% X20',sym,precio,sl,tp1);st.showUntil=ahora+600000;st.lastSignal=ahora;st.bloq=true;historial.push({id:Date.now(),fecha:new Date().toLocaleString(),symbol:sym,tipo:'SHORT LIQ -10% X20',entry:precio,sl:sl,tp1:tp1,tp2:tp2,resultado:'PENDING',exitPrice:0,profit:0,profit20:0,conf100:true,horaGanada:''});guardarHistorial();return;}if((nearYearlyPivot||supportZone)&&main.rsi<34&&precio<main.boll.dn*1.005&&vol.ok&&granReboteVol&&bullish>=6&&st.lastP>0){let sl=precio-main.atr*1.0,tp1=precio*1.10,tp2=precio*1.15,caja=caja100Long(sym,precio,sl,tp1,tp2,main.vol.ratio,main.rsi);document.getElementById('sig-'+sym).innerHTML=caja;pumpsEstado[sym]={time:ahora,html:caja};mostrarAlerta('LONG LIQUIDACION +10% X20',sym,precio,sl,tp1);st.showUntil=ahora+600000;st.lastSignal=ahora;st.bloq=true;historial.push({id:Date.now(),fecha:new Date().toLocaleString(),symbol:sym,tipo:'LONG LIQ +10% X20',entry:precio,sl:sl,tp1:tp1,tp2:tp2,resultado:'PENDING',exitPrice:0,profit:0,profit20:0,conf100:true,horaGanada:''});guardarHistorial();return;}if(st.lastP>0&&st.lastP<b.up&&precio>b.up&&bullish>=6&&vol.ok&&vol.ratio>1.5){let sl=precio-main.atr*1.5,tp1=precio+main.atr*1.5,tp2=precio+main.atr*3;document.getElementById('sig-'+sym).innerHTML=cajaNormal(sym,precio,sl,tp1,tp2,'LONG');st.showUntil=ahora+300000;st.lastSignal=ahora;}else if(st.lastP>0&&st.lastP<b.dn&&precio<b.dn&&bearish>=6&&vol.ok&&vol.ratio>1.5){let sl=precio-main.atr*1.5,tp1=precio-main.atr*1.5,tp2=precio-main.atr*3;document.getElementById('sig-'+sym).innerHTML=cajaNormal(sym,precio,sl,tp1,tp2,'SHORT');st.showUntil=ahora+300000;st.lastSignal=ahora;}st.lastP=precio;}catch{}}
async function tick(){let arr=Array.from(activos);await Promise.all(arr.map(s=>check(s)));document.getElementById('e').innerText="⚡ RAPIDO TREND PRO + SKYNET + KRONOS | 100% CONFIRMADO 24/7 | "+activos.size+" monedas | "+new Date().toLocaleTimeString();renderPumpsEnVivo();}
