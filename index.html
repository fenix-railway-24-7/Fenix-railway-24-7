let todasMonedas=JSON.parse(localStorage.getItem('fenix_todas')||'[]'); let estado={};
const TFS=['1m','5m','15m','1h','4h','1d']; 
const TELEGRAM_TOKEN="8825910376:AAHpnjHuhaLyJhQMI9oOZmqxEcupaId-54E"; const TELEGRAM_CHAT_ID="8639536197";

function boll(arr){let s=arr.slice(-20).reduce((a,b)=>a+b,0)/20;let st=Math.sqrt(arr.slice(-20).map(x=>(x-s)**2).reduce((a,b)=>a+b,0)/20);return{up:s+st*2,low:s-st*2,mid:s}}
function ema(arr,p){let k=2/(p+1);let e=arr[0];for(let i=1;i<arr.length;i++) e=arr[i]*k+e*(1-k);return e}
function rsi(arr){let g=0,l=0;for(let i=1;i<14;i++){let d=arr[arr.length-i]-arr[arr.length-i-1];if(d>0)g+=d;else l+=-d}if(l==0)return 100;return 100-(100/(1+g/l))}
function atr(k){let trs=[];for(let i=1;i<k.length;i++){let h=+k[i][2],l=+k[i][3],pc=+k[i-1][4];trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)))}return trs.slice(-14).reduce((a,b)=>a+b,0)/14||k[k.length-1][4]*0.01}
function cajaConFuego(sym,precio,bullish,tipo){
 let esLong=bullish>=3; let border=tipo==='RUPTURA'?(esLong?'#00ff88':'#ff2244'):'#333';
 let anim=tipo==='RUPTURA'?`animation:${esLong?'firePulseGreen':'firePulseRed'} 0.8s infinite;`:'';
 let llamas=tipo==='RUPTURA'?`<div style="background:${esLong?'linear-gradient(90deg,#00ff88,#ffff00)':'linear-gradient(90deg,#ff2244,#ffaa00)'};color:#000;font-weight:900;font-size:11px;text-align:center;padding:6px">🔥🔥🔥 SEÑAL 100% CONFIRMADA EN LLAMAS ${esLong?'VERDES 🟢🟢🟢':'ROJAS 🔴🔴🔴'} 6/6 🔥🔥🔥</div>`:'';
 let pre=tipo==='PRE'?`<div style="background:linear-gradient(90deg,#ffaa00,#ff4500);color:#000;font-weight:900;font-size:11px;text-align:center;padding:6px">🔥🔥🔥 Próxima ruptura confirmada en 10 minutos 🔥🔥🔥</div>`:'';
 let reb=tipo==='REBOTE'?`<div style="background:#222;color:#fff;font-size:10px;text-align:center;padding:4px">📊 SEÑAL 6/6 REBOTE CONFIRMADO (SIN LLAMAS)</div>`:'';
 let entry=(precio*0.981).toFixed(precio<1?6:2), tp1=(precio*(esLong?1.031:0.969)).toFixed(precio<1?6:2), tp2=(precio*(esLong?1.065:0.935)).toFixed(precio<1?6:2), sl=(precio*(esLong?0.971:1.029)).toFixed(precio<1?6:2);
 return `<div style="border-top:3px solid ${border};${anim}background:#111;padding:8px">${llamas}${pre}${reb}<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:${esLong?'#00ff88':'#ff4444'}">${esLong?'↗ LONG':'↘ SHORT'} ${bullish}/6 ${tipo}</span><span>Entry $${entry} | SL $${sl} | TP1 $${tp1} TP2 $${tp2}</span></div></div>`;
}
async function fetchTF(sym,interval){try{let r=await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${sym}&interval=${interval}&limit=30`);let k=await r.json();if(!k||k.length<20)return null;let closes=k.map(x=>+x[4]);return{closes,ema9:ema(closes,9),ema21:ema(closes,21),rsi:rsi(closes),boll:boll(closes),atr:atr(k),precio:closes[closes.length-1]}}catch{return null}}
async function check(sym){try{
 let results=await Promise.all(TFS.map(tf=>fetchTF(sym,tf)));
 let bullish=0,tfText='',main=null; results.forEach((d,i)=>{if(!d)return;if(!main)main=d;if(d.ema9>d.ema21&&d.rsi>50)bullish++;tfText+=`${TFS[i][0]}:${d.ema9>d.ema21?'🟢':'🔴'}`});
 if(!main)return; let precio=main.precio; let esLong=bullish>=3;
 let pEl=document.getElementById('p-'+sym); if(pEl) pEl.innerHTML=`$${precio.toFixed(precio<1?5:2)}`;
 let tfEl=document.getElementById('tf-'+sym); if(tfEl) tfEl.innerHTML=`${tfText} ${bullish}/6`;
 if(!estado[sym])estado[sym]={lastP:0,bloq:false,preBloq:false,reboteBloq:false};
 let st=estado[sym]; let box=document.getElementById('sig-'+sym);
 let distUp=((main.boll.up-precio)/precio)*100, distLow=((precio-main.boll.low)/precio)*100;
 let cercaUp=distUp>0&&distUp<1.2, cercaLow=distLow>0&&distLow<1.2;
 if(bullish>=5&&!st.preBloq&&cercaUp){let e=(precio*0.981).toFixed(5),sl=(precio*0.971).toFixed(5),tp1=(precio*1.031).toFixed(5),tp2=(precio*1.065).toFixed(5);enviarTelegram(`🔥🔥🔥🔥 Próxima ruptura confirmada en 10 minutos 🔥🔥🔥🔥🔥\n\n<b>${sym} PRE-RUPTURA</b>\n\nLong-comprar 🟢🟢🟢\nPrecio de entrada: $${e}\nStop Loss: $${sl}\nTP1: $${tp1} TP2: $${tp2}\n\n🔥🔥🔥 Próxima ruptura confirmada en 10 minutos 🔥🔥🔥`);if(box)box.innerHTML=cajaConFuego(sym,precio,bullish,'PRE');st.preBloq=true;setTimeout(()=>st.preBloq=false,600000);}
 if(bullish<=1&&!st.preBloq&&cercaLow){let e=(precio*0.981).toFixed(5),sl=(precio*1.029).toFixed(5),tp1=(precio*0.969).toFixed(5),tp2=(precio*0.935).toFixed(5);enviarTelegram(`🔥🔥🔥🔥 Próxima ruptura confirmada en 10 minutos 🔥🔥🔥🔥🔥\n\n<b>${sym} PRE-RUPTURA</b>\n\nShort-venta 🛑🛑🛑🛑🛑\nPrecio de entrada: $${e}\nStop Loss: $${sl}\nTP1: $${tp1} TP2: $${tp2}`);if(box)box.innerHTML=cajaConFuego(sym,precio,bullish,'PRE');st.preBloq=true;setTimeout(()=>st.preBloq=false,600000);}
 if(st.lastP>0&&((st.lastP<main.boll.up&&precio>main.boll.up)||(st.lastP>main.boll.low&&precio<main.boll.low))&&bullish>=4&&!st.bloq){
  let e=(precio*0.981).toFixed(5),tp1=(precio*(esLong?1.031:0.969)).toFixed(5),tp2=(precio*(esLong?1.065:0.935)).toFixed(5),sl=(precio*(esLong?0.971:1.029)).toFixed(5);let tipo=esLong?"LONG":"SHORT";
  enviarTelegram(`🔥🔥🔥 SEÑAL 100% CONFIRMADA EN LLAMAS ${tipo=="LONG"?"VERDES 🟢🟢🟢":"ROJAS 🔴🔴🔴"} 6/6 🔥🔥🔥\n\n<b>${sym} ${tipo} RUPTURA REAL</b>\n\n${tipo=="LONG"?"Long-comprar 🟢🟢🟢":"Short-venta 🛑🛑🛑"}\nPrecio de entrada: $${e}\nStop Loss: $${sl}\nTP1: $${tp1} TP2: $${tp2}`);
  if(box)box.innerHTML=cajaConFuego(sym,precio,bullish,'RUPTURA');st.bloq=true;setTimeout(()=>st.bloq=false,90000);
 } else {
  let esRebUp=st.lastP>0&&st.lastP>=main.boll.up*0.99&&precio<main.boll.up&&precio>main.boll.mid;
  let esRebLow=st.lastP>0&&st.lastP<=main.boll.low*1.01&&precio>main.boll.low&&precio<main.boll.mid;
  if((esRebUp||esRebLow)&&bullish>=6&&!st.reboteBloq){
   let e=(precio*0.981).toFixed(5),tp1=(precio*(esLong?1.031:0.969)).toFixed(5),tp2=(precio*(esLong?1.065:0.935)).toFixed(5),sl=(precio*(esLong?0.971:1.029)).toFixed(5);let tipo=esLong?"LONG":"SHORT";
   enviarTelegram(`📊 SEÑAL 6/6 REBOTE CONFIRMADO (SIN LLAMAS)\n\n<b>${sym} ${tipo} REBOTE</b>\n\n${tipo=="LONG"?"Long-comprar 🟢🟢🟢":"Short-venta 🛑🛑🛑"}\nPrecio de entrada: $${e}\nStop Loss: $${sl}\nTP1: $${tp1} TP2: $${tp2}`);
   if(box)box.innerHTML=cajaConFuego(sym,precio,bullish,'REBOTE');st.reboteBloq=true;setTimeout(()=>st.reboteBloq=false,120000);
  }
 }
 st.lastP=precio;
}catch{}}
let _busy=false; async function tick(){if(_busy)return;_busy=true;await Promise.all(Array.from(activos).map(s=>check(s)));document.getElementById('e').innerText=`⚡ RAPIDO ${activos.size} | ${new Date().toLocaleTimeString()}`;_busy=false;}

render();setTimeout(iniciar,600);
