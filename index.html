async function enviarTelegram(t){try{fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text:t,parse_mode:'HTML'})})}catch{}}
function ma(arr,p){if(arr.length<p)return arr[arr.length-1];let s=0;for(let i=arr.length-p;i<arr.length;i++)s+=arr[i];return s/p}
function boll(arr){let s=ma(arr,20);let st=Math.sqrt(arr.slice(-20).reduce((a,c)=>a+(c-s)**2,0)/20);return{up:s+st*2,low:s-st*2,mid:s}}
function ema(arr,p){let k=2/(p+1);let e=arr[0];for(let i=1;i<arr.length;i++)e=arr[i]*k+e*(1-k);return e}
function rsi(arr){let g=0,l=0;for(let i=arr.length-14;i<arr.length;i++){let d=arr[i]-arr[i-1];if(d>0)g+=d;else l+=-d}if(l==0)return 100;return 100-(100/(1+g/l))}
function atr(k){let trs=[];for(let i=1;i<k.length;i++){let h=+k[i][2],l=+k[i][3],pc=+k[i-1][4];trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)))}return trs.slice(-14).reduce((a,b)=>a+b,0)/14||k[k.length-1][4]*0.01}

async function cargarTodasBinanceCompleto(){

function genPathsCompleto(closes){
 let slice=closes.slice(-80); let min=Math.min(...slice),max=Math.max(...slice),range=max-min||1;
 let norm=v=>{return 24-((v-min)/range)*20};
 let line='', ma7='', ma25='', ma99='', vol='';
 slice.forEach((v,i)=>{let x=(i/79)*110,y=norm(v);line+=(i==0?'M':' L')+x+','+y;});
 let ma7a=[], ma25a=[], ma99a=[]; for(let i=0;i<closes.length;i++){ma7a.push(ma(closes.slice(0,i+1),7));ma25a.push(ma(closes.slice(0,i+1),25));ma99a.push(ma(closes.slice(0,i+1),99));}
 ma7a.slice(-80).forEach((v,i)=>{let x=(i/79)*110,y=norm(v);ma7+=(i==0?'M':' L')+x+','+y;});
 ma25a.slice(-80).forEach((v,i)=>{let x=(i/79)*110,y=norm(v);ma25+=(i==0?'M':' L')+x+','+y;});
 ma99a.slice(-80).forEach((v,i)=>{let x=(i/79)*110,y=norm(v);ma99+=(i==0?'M':' L')+x+','+y;});
 return {line,ma7,ma25,ma99,lastMa7:ma7a[ma7a.length-1],lastMa25:ma25a[ma25a.length-1],lastMa99:ma99a[ma99a.length-1],min,max};
}

function cajaMejorada(sym,precio,bullish,closes,tipo){
 let esLong=bullish>=3; let isRup=tipo==='RUPTURA'; let isPre=tipo==='PRE'; let isReb=tipo==='REBOTE';

 let g=genPathsCompleto(closes);
 let entry=(precio*0.981).toFixed(precio<1?6:2), tp1=(precio*(esLong?1.031:0.969)).toFixed(precio<1?6:2), tp2=(precio*(esLong?1.065:0.935)).toFixed(precio<1?6:2), sl=(precio*(esLong?0.971:1.029)).toFixed(precio<1?6:2);
 let llamas=isRup?`<div style="background:${esLong?'linear-gradient(90deg,#00ff88,#ffff00,#00ff88)':'linear-gradient(90deg,#ff2244,#ffaa00,#ff2244)'};color:#000;font-weight:900;font-size:11px;text-align:center;padding:8px;border-radius:10px;margin-bottom:6px;animation:textFire 0.6s infinite"><span style="animation:flameMove 0.3s infinite">🔥</span> SEÑAL 100% CONFIRMADA EN LLAMAS ${esLong?'VERDES 🟢🟢🟢':'ROJAS 🔴🔴🔴'} 6/6 <span style="animation:flameMove 0.4s infinite">🔥</span><br>VELOCIDAD MAX ⚡</div>`:'';
 let preAviso=isPre?`<div style="background:linear-gradient(90deg,#ffaa00,#ff4500);color:#000;font-weight:900;font-size:10px;text-align:center;padding:6px;border-radius:8px;margin-bottom:4px">🔥🔥🔥 Próxima ruptura confirmada en 10 minutos 🔥🔥🔥</div>`:'';
 let rebAviso=isReb?`<div style="background:#222;color:#aaa;font-size:9px;text-align:center;padding:4px;border-radius:6px">📊 REBOTE 6/6 SIN LLAMAS</div>`:'';
 return `<div style="position:relative;border:4px solid ${border};${anim}border-radius:20px;background:radial-gradient(ellipse at center,${esLong?'#1a3320':'#331a1a'},#0e0e1a);padding:10px;overflow:hidden">
 ${isRup?`<div style="position:absolute;top:-10px;left:0;right:0;display:flex;justify-content:space-around;font-size:28px"><span style="animation:flameMove 0.3s infinite">🔥</span><span style="animation:flameMove 0.5s infinite">🔥</span><span style="animation:flameMove 0.35s infinite">🔥</span><span style="animation:flameMove 0.45s infinite">🔥</span></div>`:''}
 ${llamas}${preAviso}${rebAviso}
 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:${isRup?'10px':'0'}"><span style="background:${esLong?'#0a2e1a':'#3d1216'};color:${border};font-weight:900;font-size:12px;padding:5px 10px;border-radius:10px;border:2px solid ${border}">${esLong?'↗ LONG':'↘ SHORT'} ${bullish}/6 ${tipo}</span><b style="font-size:16px">${sym.replace('USDT','')}/USDT</b></div>
 <div style="font-size:10px;color:#ffeb3b;margin:4px 0">MA(7):${g.lastMa7.toFixed(2)} <span style="color:#ff69b4">MA(25):${g.lastMa25.toFixed(2)}</span> <span style="color:#9b7cff">MA(99):${g.lastMa99.toFixed(2)}</span></div>
 <div style="background:#000;border-radius:12px;padding:6px;border:1.5px solid #222"><svg width="100%" height="90" viewBox="0 0 110 26" preserveAspectRatio="none">

 </svg><div style="display:flex;justify-content:space-between;font-size:8px;color:#666;margin-top:2px"><span>Vol(BNB) MA5 MA10</span><span>RSI(6):${bullish>3?'54':46}</span><span>$${precio.toFixed(precio<1?5:2)}</span></div></div>
 <div style="font-size:11px;margin-top:6px"><b style="font-size:18px;color:#fff">$${precio.toFixed(precio<1?6:2)}</b><span style="float:right;color:${esLong?'#00ff88':'#ff4444'}">${esLong?'+1.89% ↑':'-1.25% ↓'}</span><br>Entry $${entry} | SL $${sl}<br><span style="color:#00ff88">TP1 $${tp1}</span> <span style="color:#888">TP2 $${tp2}</span></div>

async function fetchTF(sym,interval){try{let r=await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${sym}&interval=${interval}&limit=50`);if(!r.ok)return null;let k=await r.json();if(!k||k.length<20)return null;let closes=k.map(x=>+x[4]);return{closes,ema9:ema(closes,9),ema21:ema(closes,21),rsi:rsi(closes),boll:boll(closes),atr:atr(k),precio:closes[closes.length-1]}}catch{return null}}

async function check(sym){
 try{
  let results=await Promise.all(TFS.map(tf=>fetchTF(sym,tf)));
  let bullish=0,main=null,closesMain=[]; results.forEach(d=>{if(!d)return;if(!main)main=d;closesMain=d.closes;if(d.ema9>d.ema21&&d.rsi>50)bullish++;});
  if(!main)return null;
  let precio=main.precio, esLong=bullish>=3;
  if(!estado[sym])estado[sym]={lastP:0,bloq:false,preBloq:false,reboteBloq:false};
  let st=estado[sym];
  let distUp=((main.boll.up-precio)/precio)*100, distLow=((precio-main.boll.low)/precio)*100;
  let cercaUp=distUp>0&&distUp<1.2, cercaLow=distLow>0&&distLow<1.2;
  let tipo=null;
  if(bullish>=5&&!st.preBloq&&(cercaUp||cercaLow)){tipo='PRE'; enviarTelegram(`🔥🔥🔥🔥 Próxima ruptura confirmada en 10 minutos 🔥🔥🔥🔥🔥\n\n<b>${sym} ${esLong?'LONG 🟢🟢🟢':'SHORT 🔴🔴🔴'}</b>\nEntry $${(precio*0.981).toFixed(5)} SL $${(precio*0.971).toFixed(5)} TP1 $${(precio*1.031).toFixed(5)}\n\n🔥🔥🔥 Próxima ruptura confirmada en 10 minutos 🔥🔥🔥`); st.preBloq=true;setTimeout(()=>st.preBloq=false,600000);}
  else if(st.lastP>0&&((st.lastP<main.boll.up&&precio>main.boll.up)||(st.lastP>main.boll.low&&precio<main.boll.low))&&bullish>=4&&!st.bloq){tipo='RUPTURA'; enviarTelegram(`🔥🔥🔥 SEÑAL 100% CONFIRMADA EN LLAMAS ${esLong?'VERDES 🟢🟢🟢':'ROJAS 🔴🔴🔴'} 6/6 🔥🔥🔥\n\n<b>${sym} ${esLong?'LONG':'SHORT'} RUPTURA REAL</b>\nEntry $${(precio*0.981).toFixed(5)} SL $${(precio*0.971).toFixed(5)} TP1 $${(precio*1.031).toFixed(5)}`); st.bloq=true;setTimeout(()=>st.bloq=false,90000);}
  else if(st.lastP>0&&((st.lastP>=main.boll.up*0.99&&precio<main.boll.up)||(st.lastP<=main.boll.low*1.01&&precio>main.boll.low))&&bullish>=6&&!st.reboteBloq){tipo='REBOTE'; enviarTelegram(`📊 SEÑAL 6/6 REBOTE CONFIRMADO (SIN LLAMAS)\n\n<b>${sym} ${esLong?'LONG':'SHORT'} REBOTE</b>\nEntry $${(precio*0.981).toFixed(5)}`); st.reboteBloq=true;setTimeout(()=>st.reboteBloq=false,120000);}
  st.lastP=precio;
  if(tipo) return {sym,precio,bullish,closes:closesMain,tipo};
  // Solo mostrar si es 5/6 o 6/6 en modo TODAS
  if(bullish>=5) return {sym,precio,bullish,closes:closesMain,tipo:'NORMAL'};
  return null;
 }catch{return null;}
}

function renderLista(lista){

 lista.filter(x=>x).sort((a,b)=>b.bullish-a.bullish).forEach(d=>{
  let div=document.createElement('div'); div.innerHTML=cajaMejorada(d.sym,d.precio,d.bullish,d.closes,d.tipo); c.appendChild(div);
 });
}

let scanIndex=0; let resultadosAcumulados=[];
async function tickAuto(){
 if(todasMonedas.length===0) return;
 let batch=todasMonedas.slice(scanIndex,scanIndex+30); // escanea 30 monedas a la vez
 scanIndex+=30; if(scanIndex>=todasMonedas.length){scanIndex=0; resultadosAcumulados=[]; document.getElementById('e').innerText=`♻️ REINICIO SCAN ${new Date().toLocaleTimeString()}`;}
 let res=await Promise.all(batch.map(s=>check(s)));
 res.filter(x=>x).forEach(r=>{ if(!resultadosAcumulados.find(z=>z.sym===r.sym)) resultadosAcumulados.push(r); else { let idx=resultadosAcumulados.findIndex(z=>z.sym===r.sym); resultadosAcumulados[idx]=r;} });
 renderLista(resultadosAcumulados);
 document.getElementById('e').innerText=`⚡ AUTO ${scanIndex}/${todasMonedas.length} | ${resultadosAcumulados.length} señales | ${new Date().toLocaleTimeString()}`;
}
