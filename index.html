async function check(sym){try{let results=await Promise.all(TFS.map(tf=>fetchTF(sym,tf)));let bullish=0,tfText='',closesMain=[],main=null,esLong=true;results.forEach((d,i)=>{if(!d)return;if(i==0)closesMain=d.closes;if(!main)main=d;if(d.ema9>d.ema21&&d.rsi>50)bullish++;tfText+=`${TFS[i]}:${d.ema9>d.ema21?'🟢':'🔴'} `});if(!main)return;let precio=main.precio;esLong=bullish>=3;if(!estado[sym]) estado[sym]={lastP:0,bloq:false}; estado[sym].bullish=bullish;
let pEl=document.getElementById('p-'+sym); if(pEl) pEl.innerHTML=`$${precio.toFixed(precio<1?6:2)} <span style="font-size:10px;color:#888">ATR ${main.atr.toFixed(2)} AR16</span>`;let tfEl=document.getElementById('tf-'+sym); if(tfEl) tfEl.innerHTML=`${tfText} | ${bullish}/6 LONG | SKYNET ⚡`;revisarTrades(precio,sym);let st=estado[sym];let box=document.getElementById('sig-'+sym);if(box)box.innerHTML=cajaConFuego(sym,precio,'KRONOS+SKYNET',bullish,'',closesMain);
// SOLO TELEGRAM 6/6 - SIN RENDER PARA NO BORRAR
if(st.lastP>0&&st.lastP<main.boll.up&&precio>main.boll.up&&bullish>=6&&!st.bloq){
let entry=(precio*0.981).toFixed(6),tp1=(precio*1.031).toFixed(6),tp2=(precio*1.065).toFixed(6),sl=(precio*0.971).toFixed(6);if(!esLong){entry=(precio*0.981).toFixed(6);tp1=(precio*0.969).toFixed(6);tp2=(precio*0.935).toFixed(6);sl=(precio*1.029).toFixed(6)}historial.push({id:Date.now(),fecha:new Date().toLocaleString(),symbol:sym,entry:precio,sl:precio-main.atr*1.5,tp1:precio+main.atr*1.5,tp2:precio+main.atr*3,resultado:'PENDING',profit:0});guardarHistorial();beep(900);let tipo=esLong?"LONG":"SHORT";let fuego=`🔥🔥🔥 SEÑAL 100% CONFIRMADA EN LLAMAS ${tipo=="LONG"?"VERDES 🟢🟢🟢":"ROJAS 🔴🔴🔴"} 6/6`;let msgTG=`🐦‍🔥 Bot Fénix OFICIAL 6/6 ARRIBA\n${fuego}\n\n<b>${sym}</b> ${tipo} 6/6 ⚡\nPrecio: $${precio.toFixed(6)}\nEntry: $${entry}\nTP1: $${tp1}\nTP2: $${tp2}\nSL: $${sl}`;enviarTelegram(msgTG);
// MOVER 6/6 AL INICIO SIN BORRAR
let cont=document.getElementById('lista'); let card=document.getElementById('C-'+sym); if(cont&&card){cont.prepend(card);}
st.bloq=true;setTimeout(()=>st.bloq=false,120000)}st.lastP=precio}catch(e){}}
async function tick(){let lista=Array.from(activos);for(let i=0;i<lista.length;i+=3){let batch=lista.slice(i,i+3);await Promise.all(batch.map(s=>check(s)));await new Promise(r=>setTimeout(r,700));}document.getElementById('e').innerText=`⚡ AUTO ${activos.size}/${todasMonedas.length} | Hist ${historial.length} | ${new Date().toLocaleTimeString()} - 6/6 ARRIBA FIX`}
function iniciarAuto(){if(autoIniciado) return;autoIniciado=true;render();actualizarStats();tick();setInterval(tick,8000);setInterval(cargarNoticiasBinance,40000);cargarTodas();enviarTelegram('✅ Bot Fénix OFICIAL FIX REAL $-- - 6/6 arriba');beep(700)}
render();cargarTodas();cargarNoticiasBinance();actualizarStats();setTimeout(iniciarAuto,800);
