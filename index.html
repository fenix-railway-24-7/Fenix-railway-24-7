<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FENIX AUTO OBSERVA TODAS - RECUADROS IDENTICOS</title>
<style>
@keyframes firePulseGreen{0%{box-shadow:0 0 20px #00ff88}50%{box-shadow:0 0 60px #00ff88}100%{box-shadow:0 0 20px #00ff88}}
@keyframes firePulseRed{0%{box-shadow:0 0 20px #ff2244}50%{box-shadow:0 0 60px #ff2244}100%{box-shadow:0 0 20px #ff2244}}
</style></head><body style="margin:0;background:#000;color:#fff;font-family:Arial"><div style="padding:6px">
<div style="background:linear-gradient(90deg,#ff4500,#ffaa00);color:#000;padding:6px;border-radius:6px;text-align:center;font-weight:900;font-size:11px">🔥 Bot Fénix AUTO - OBSERVA TODAS BINANCE - LLAMAS VERDES Y ROJAS REALES 🔥</div>
<div id="contadorBinance" style="background:linear-gradient(90deg,#00ff88,#ffaa00);color:#000;padding:5px;border-radius:6px;font-size:10px;font-weight:900;text-align:center;margin:4px 0">CARGANDO 1032 MONEDAS SPOT+FUTUROS+ALPHA...</div>
<div style="display:flex;gap:4px;margin:4px 0"><button onclick="modo='SENAL';renderLista()" style="flex:1;padding:8px;background:#00ff88;color:#000;border:0;border-radius:8px;font-weight:900;font-size:10px">🔥 SOLO SEÑALES 5/6 Y 6/6 AUTO</button><button onclick="modo='TODAS';renderLista()" style="flex:1;padding:8px;background:#222;color:#fff;border:1px solid #333;border-radius:8px;font-size:10px">📊 VER TODO LO QUE OBSERVA</button><span id="e" style="background:#111;padding:6px;border-radius:6px;font-size:9px">OBSERVANDO...</span></div>
<div id="lista" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px"></div>
</div>
<script>
let todasMonedas=["BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT","AKEUSDT","QUSDT","PUMPUSDT","IRYSUSDT","PEPEUSDT","DOGEUSDT","4USDT","FLOKIUSDT","BONKUSDT","SHIBUSDT","XRPUSDT"]; 
let resultadosAcumulados=[]; let estado={}; let modo='SENAL'; let scanIndex=0;
const TFS=['1m','5m','15m','1h','4h','1d','2h'];
const TELEGRAM_TOKEN="8825910376:AAHpnjHuhaLyJhQMI9oOZmqxEcupaId-54E"; const TELEGRAM_CHAT_ID="8639536197";
async function enviarTelegram(t){try{fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text:t,parse_mode:'HTML'})})}catch{}}
function ma(arr,p){if(arr.length<p)return arr[arr.length-1];let s=0;for(let i=arr.length-p;i<arr.length;i++)s+=arr[i];return s/p}
function boll(arr){let s=ma(arr,20);let st=Math.sqrt(arr.slice(-20).reduce((a,c)=>a+(c-s)**2,0)/20);return{up:s+st*2,low:s-st*2,mid:s}}
function ema(arr,p){let k=2/(p+1);let e=arr[0];for(let i=1;i<arr.length;i++) e=arr[i]*k+e*(1-k);return e}
function rsi(arr){let g=0,l=0;for(let i=arr.length-14;i<arr.length;i++){let d=arr[i]-arr[i-1];if(d>0)g+=d;else l+=-d}if(l==0)return 100;return 100-(100/(1+g/l))}
function atr(k){let trs=[];for(let i=1;i<k.length;i++){let h=+k[i][2],l=+k[i][3],pc=+k[i-1][4];trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)))}return trs.slice(-14).reduce((a,b)=>a+b,0)/14||k[k.length-1][4]*0.01}

async function cargarTodasBinanceCompleto(){
 try{
  let r=await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo'); let d=await r.json();
  let lista=d.symbols.filter(s=>s.symbol.endsWith('USDT')&&s.status==='TRADING').map(s=>s.symbol);
  todasMonedas=lista; // TODAS LAS 1032
  document.getElementById('contadorBinance').innerHTML=`✅ OBSERVANDO AUTO: ${lista.length} MONEDAS SPOT+FUTUROS+ALPHA | EL BOT LAS OBSERVA SOLO Y LAS PONE EN TU PANEL`;
 }catch(e){document.getElementById('contadorBinance').innerHTML=`⚠️ OBSERVANDO ${todasMonedas.length} MONEDAS (MODO LOCAL) | SE AGREGAN SOLAS AL PANEL`;}
}

function genPath(closes){if(!closes||closes.length<5)return{line:'M0,20 L110,2',area:'M0,25 L0,20 L110,2 L110,25 Z'};let slice=closes.slice(-50);let min=Math.min(...slice),max=Math.max(...slice),range=max-min||1;let norm=v=>22-((v-min)/range)*18;let line='',area='';slice.forEach((v,i)=>{let x=(i/49)*110,y=norm(v);line+=(i==0?'M':' L')+x+','+y;if(i==0)area+='M'+x+',25 L'+x+','+y;else area+=' L'+x+','+y;});area+=' L110,25 L0,25 Z';return{line,area};}
function caja(sym,precio,bullish,bullishShort,closes,tipo){
 let esLong=bullish>=4; let isRup=tipo==='RUPTURA'; let border=isRup?(esLong?'#00ff88':'#ff2244'):(esLong?'#00ff88':'#ff3b4a'); let anim=isRup?`animation:${esLong?'firePulseGreen':'firePulseRed'} 0.8s infinite;`:'';
 let g=genPath(closes); let entry=(precio*0.981).toFixed(precio<1?6:2), tp1=(precio*(esLong?1.031:0.969)).toFixed(precio<1?6:2), tp2=(precio*(esLong?1.065:0.935)).toFixed(precio<1?6:2), sl=(precio*(esLong?0.971:1.029)).toFixed(precio<1?6:2);
 let llamas=isRup?`<div style="background:${esLong?'linear-gradient(90deg,#00ff88,#ffff00)':'linear-gradient(90deg,#ff2244,#ffaa00)'};color:#000;font-weight:900;font-size:9px;text-align:center;padding:5px;border-radius:8px;margin-bottom:4px">🔥 SEÑAL 100% CONFIRMADA EN LLAMAS ${esLong?'VERDES 🟢🟢🟢':'ROJAS 🔴🔴🔴'} 6/6 🔥</div>`:'';
 let pre=tipo==='PRE'?`<div style="background:linear-gradient(90deg,#ffaa00,#ff4500);color:#000;font-weight:900;font-size:8px;text-align:center;padding:4px;border-radius:6px;margin-bottom:4px">🔥 Próxima ruptura confirmada en 10 minutos 🔥</div>`:'';
 return `<div style="border-radius:14px;border:3px solid ${border};${anim}background:#0a0a12;overflow:hidden">
 <div style="background:#1a1a1a;padding:6px 8px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:900;font-size:13px;color:#fff">${sym} <span style="color:#00ff88;font-size:10px">(0W/0L)</span></div><div style="font-weight:900;font-size:13px;color:#00ff88">PRECIO: $${precio.toFixed(precio<1?6:2)} ⚡</div><div style="font-size:10px;color:#aaa;background:#000;padding:2px 4px;border-radius:4px;margin-top:2px">${bullish>=4?'1m:🟢 5m:🟢 15m:🟢 1h:🟢':'1m:🟢 5m:🟢 15m:🔴 1h:🔴 2h:🔴 4h:🔴 1d:🔴'} | ${bullish}/7 LONG | ${bullishShort}/7 SHORT</div></div><button onclick="this.parentElement.parentElement.parentElement.remove()" style="background:#ff2222;color:#fff;border:0;padding:5px 10px;border-radius:8px;font-size:10px;font-weight:900">ELIMINAR</button></div>
 <div style="padding:6px"><div style="position:relative">${llamas}${pre}<div style="background:#0f1320;border-radius:10px;padding:5px;margin:4px 0;border:1.5px solid ${border}"><svg width="100%" height="55" viewBox="0 0 110 25" preserveAspectRatio="none"><defs><linearGradient id="g${sym}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${border}" stop-opacity="0.6"/><stop offset="100%" stop-color="${border}" stop-opacity="0.05"/></linearGradient></defs><path d="${g.area}" fill="url(#g${sym})"/><path d="${g.line}" stroke="${border}" fill="none" stroke-width="2.2"/></svg><div style="font-size:7px;color:#7a859e;display:flex;justify-content:space-between"><span>BINANCE REAL ⚡ BRILLO</span><span>${bullish}/7 ${tipo}</span></div></div><div style="font-size:9px;color:#aab0c2">Precio actual<br>Entry $${entry} <span style="float:right">Stop Loss $${sl}</span></div><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:15px;color:#fff">$${precio.toFixed(precio<1?6:2)}</b><span style="font-size:10px;color:${esLong?'#00ff88':'#ff4444'}">${esLong?'+1.89% ↑':'-1.25% ↓'}</span></div><div style="display:flex;justify-content:space-between;font-size:8px;margin-top:3px"><div><b style="color:#00ff88">■ Take Profit</b><br>TP1 $${tp1}<br>TP2 $${tp2}</div><div style="text-align:right"><b style="color:#ff4d5a">■ Stop Loss</b><br>$${sl}</div></div></div></div></div>`;
}

async function fetchTF(sym,interval){try{let r=await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${sym}&interval=${interval}&limit=30`);if(!r.ok)return null;let k=await r.json();if(!k||k.length<20)return null;let closes=k.map(x=>+x[4]);return{closes,ema9:ema(closes,9),ema21:ema(closes,21),rsi:rsi(closes),boll:boll(closes),atr:atr(k),precio:closes[closes.length-1]}}catch{return null}}

async function check(sym){
 try{
  let results=await Promise.all(TFS.map(tf=>fetchTF(sym,tf)));
  let bullishLong=0,bullishShort=0,main=null,closesMain=[]; 
  results.forEach(d=>{if(!d)return;if(!main)main=d;closesMain=d.closes;if(d.ema9>d.ema21&&d.rsi>50)bullishLong++;else bullishShort++;});
  if(!main)return null;
  let precio=main.precio; let bullish=bullishLong;
  if(!estado[sym])estado[sym]={lastP:0,bloq:false,preBloq:false};
  let st=estado[sym]; let tipo='NORMAL';
  let distUp=((main.boll.up-precio)/precio)*100, distLow=((precio-main.boll.low)/precio)*100;
  let cercaUp=distUp>0&&distUp<1.5, cercaLow=distLow>0&&distLow<1.5;
  if(bullish>=5&&!st.preBloq&&(cercaUp||cercaLow)){tipo='PRE'; enviarTelegram(`🔥 PRE-RUPTURA ${sym} ${bullish}/7 $${precio.toFixed(5)}`); st.preBloq=true;setTimeout(()=>st.preBloq=false,600000);}
  else if(st.lastP>0&&((st.lastP<main.boll.up&&precio>main.boll.up)||(st.lastP>main.boll.low&&precio<main.boll.low))&&bullish>=4&&!st.bloq){tipo='RUPTURA'; st.bloq=true;setTimeout(()=>st.bloq=false,90000); enviarTelegram(`🔥🔥 RUPTURA REAL ${sym} 6/6 $${precio.toFixed(5)}`);}
  st.lastP=precio;
  // AUTO: Si tiene 4/7 o más, ya aparece en tu panel automáticamente
  if(bullish>=4||tipo!=='NORMAL') return {sym,precio,bullish,bullishShort,closes:closesMain,tipo};
  return null;
 }catch{return null;}
}

function renderLista(){
 let c=document.getElementById('lista');
 let filtrada=modo==='SENAL'?resultadosAcumulados.filter(x=>x&&x.bullish>=5):resultadosAcumulados.filter(x=>x);
 filtrada=filtrada.sort((a,b)=>b.bullish-a.bullish);
 if(filtrada.length===0){c.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:20px;color:#888">⚡ El bot está observando ${scanIndex}/${todasMonedas.length} monedas...<br>Cuando detecte 4/7 o más, aparecerá aquí automáticamente<br>Modo actual: ${modo} | Ya escaneadas: ${resultadosAcumulados.length}</div>`;return;}
 c.innerHTML=''; filtrada.forEach(d=>{let div=document.createElement('div'); div.innerHTML=caja(d.sym,d.precio,d.bullish,d.bullishShort,d.closes,d.tipo); c.appendChild(div);});
}

let batchSize=25;
async function tickAuto(){
 if(todasMonedas.length===0) return;
 let batch=todasMonedas.slice(scanIndex,scanIndex+batchSize);
 if(batch.length===0){scanIndex=0; return;}
 let res=await Promise.all(batch.map(s=>check(s)));
 res.filter(x=>x).forEach(r=>{
  let idx=resultadosAcumulados.findIndex(z=>z.sym===r.sym);
  if(idx>=0) resultadosAcumulados[idx]=r; else resultadosAcumulados.push(r);
 });
 scanIndex+=batchSize; if(scanIndex>=todasMonedas.length) scanIndex=0;
 renderLista();
 document.getElementById('e').innerText=`⚡ OBSERVANDO ${scanIndex}/${todasMonedas.length} | PANEL: ${resultadosAcumulados.length} | ${new Date().toLocaleTimeString()}`;
}

async function iniciar(){
 await cargarTodasBinanceCompleto();
 setInterval(tickAuto,3000);
 tickAuto();
 enviarTelegram('✅ FENIX AUTO OBSERVA TODAS ✅\n🔥 Ahora observa las 1032 monedas solo\n📊 Aparecen automáticamente en tu panel\n🔥 Recuadros idénticos a tu imagen');
}
iniciar();
</script></body></html>
